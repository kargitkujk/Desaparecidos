<body id="Sube">
<header>
    <h1>Trabajá con nosotros</h1>
     <button type="button" id="btnMenu" class="btnMenu" aria-label="Abrir menú">
                ☰
            </button>
    
    <nav class="NavegaMenu">

<section>
    <h2>Requisitos</h2>
    <ul>
        <li>-> Mayor de edad</li>   
        <li>-> Buena condición física</li>
        <li>-> Responsabilidad</li>
    </ul>
</section>

<section>
    
    <h2>Postulación</h2>
   
        <div>
       
        
        <label for="email">Correo electrónico:</label>
        <input type="email" id="email" placeholder="Ej: nombre@email.com" required autocomplete="email"><br>

        <label for="sobreVos">Contanos sobre vos:</label>
        <textarea id="sobreVos" placeholder="Experiencia, habilidades, etc..." required autocomplete="off"></textarea><br>

        <label for="archivo">Adjuntar archivo (PDF):</label>
        <input type="file" id="archivo" accept=".pdf" required><br>

        <label>
            <input type="checkbox" id="aceptacion" required>
            Acepto ser contactado por la empresa</label><br>
        
        </div>
        <label for="solicitud">Solicitud:</label>
        <input type="hidden" id="solicitud" placeholder="" value="Solicitud de Trabajo"></br>
        <button type="submit">Enviar CV</button>
        <a href="index.html" class="btn">Volver al inicio</a>
        <a href="#Sube" class="Sube">↑ Subir</a>

</section>

<footer>
